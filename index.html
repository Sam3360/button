<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1C1C1E;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .button {
        width: 220px;
        height: 220px;
        border: none;
        border-radius: 50%;
        background: #e50909;
        cursor: pointer;

        box-shadow:
            0 14px 0 #a80000,
            0 22px 35px rgba(0, 0, 0, 0.18);

        transition:
            transform 0.12s cubic-bezier(.2,.8,.2,1),
            box-shadow 0.12s cubic-bezier(.2,.8,.2,1);
        
        -webkit-tap-highlight-color: transparent;
        outline: none;
    }

    .button:active {
        transform: translateY(11px) scale(0.97);
        box-shadow:
            0 3px 0 #a80000,
            0 9px 20px rgba(0, 0, 0, 0.16);
    }
   h1 {
    position: absolute;
    top: 30px;
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
    font-weight: 700;
}
</style>
</head>

<body>
<h1>DO NOT CLICK</h1>

<button class="button" aria-label="Useless button"></button>

</body>
</html>
